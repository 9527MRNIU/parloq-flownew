# BaoTa may preserve the original Host, preserve it in X-Forwarded-Host, or use
# Host=127.0.0.1 for a host-loopback management proxy. These maps support all
# three modes while keeping explicit customer hosts on the public surface.
map $http_x_forwarded_host $parloq_public_host {
    "" $host;
    default $http_x_forwarded_host;
}

map $parloq_public_host $parloq_management_request {
    default 0;
    # Port 18100 is bound to host loopback only. BaoTa's loopback Host is the
    # trusted management-vhost marker when it does not preserve the hostname.
    "127.0.0.1" 1;
    "${MANAGEMENT_HOST}" 1;
}

# Customer landing-page hosts use the default virtual host. Only public API
# routes and the short landing paths are exposed; the management SPA must
# never be served from a customer domain.
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;

    # Route BaoTa's Host=127.0.0.1 proxy mode to the configured management
    # origin without widening SPA access for other forwarded customer hosts.
    error_page 418 = @management_origin;
    if ($parloq_management_request = 1) {
        return 418;
    }

    location @management_origin {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host ${MANAGEMENT_HOST};
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host ${MANAGEMENT_HOST};
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location = /healthz {
        proxy_pass http://api:8000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $parloq_public_host;
    }

    location = /readyz {
        proxy_pass http://api:8000/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $parloq_public_host;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $parloq_public_host;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location ~ "^/[a-z0-9](?:[a-z0-9-]{0,118}[a-z0-9])?/1/?$" {
        rewrite "^/([a-z0-9](?:[a-z0-9-]{0,118}[a-z0-9])?)/1/?$" /api/public/promotion/channels/$1/fission/render break;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $parloq_public_host;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_read_timeout 120s;
    }

    location ~ "^/[a-z0-9](?:[a-z0-9-]{0,118}[a-z0-9])?/?$" {
        rewrite "^/([a-z0-9](?:[a-z0-9-]{0,118}[a-z0-9])?)/?$" /api/public/promotion/channels/$1/render break;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $parloq_public_host;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}

# The configured management origin is the only public host allowed to serve
# the React SPA. Port 8081 is loopback-only inside the container and is used by
# the forwarded-host compatibility route above.
server {
    listen 8080;
    listen 127.0.0.1:8081;
    server_name ${MANAGEMENT_HOST};
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location = /healthz {
        proxy_pass http://api:8000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $parloq_public_host;
    }

    location = /readyz {
        proxy_pass http://api:8000/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $parloq_public_host;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $parloq_public_host;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
