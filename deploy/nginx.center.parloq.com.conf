# Reference fragments only. Do not install this file as an Nginx vhost.
# BaoTa owns the website, reverse-proxy record, certificate paths, and vhost.
# Reconcile only the marked blocks through GetFileBody/SaveFileBody, then run
# BaoTa's nginx test and reload actions.

# Server-context fragment:
# BEGIN PARLOQ FLOW MANAGED SETTINGS
# Preserve the shared Cloudflare-only origin policy.
include /www/server/panel/vhost/ip-restrict/parloq.com.conf;
client_max_body_size 64m;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# END PARLOQ FLOW MANAGED SETTINGS

# Reverse-proxy location-context fragment:
# BEGIN PARLOQ FLOW MANAGED PROXY SETTINGS
proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
proxy_set_header CF-IPCountry $http_cf_ipcountry;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_connect_timeout 10s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;
proxy_request_buffering off;
# END PARLOQ FLOW MANAGED PROXY SETTINGS
