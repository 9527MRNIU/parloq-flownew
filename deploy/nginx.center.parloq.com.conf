server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name center.parloq.com;

    ssl_certificate /www/server/panel/vhost/cert/parloq.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/parloq.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PARLOQ_FLOW_SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    error_page 497 https://$host$request_uri;

    # Keep the same Cloudflare-only origin policy as the existing Parloq site.
    include /www/server/panel/vhost/ip-restrict/parloq.com.conf;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:18100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    access_log /www/wwwlogs/center.parloq.com.log;
    error_log /www/wwwlogs/center.parloq.com.error.log;
}
