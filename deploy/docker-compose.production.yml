name: ${COMPOSE_PROJECT_NAME:-parloq-flow}

x-api-build: &api-build
  context: "${PARLOQ_SOURCE_ROOT:-/root/parloq-flow}/apps/api"
  args:
    BUILD_VERSION: ${PARLOQ_GIT_REF:-main}

x-web-build: &web-build
  context: "${PARLOQ_SOURCE_ROOT:-/root/parloq-flow}/apps/web"
  target: production
  args:
    BUILD_VERSION: ${PARLOQ_GIT_REF:-main}

x-gateway-build: &gateway-build
  context: "${PARLOQ_SOURCE_ROOT:-/root/parloq-flow}/services/wa-gateway-baileys"
  args:
    BUILD_VERSION: ${PARLOQ_GIT_REF:-main}

x-api-environment: &api-environment
  APP_ENV: production
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}
  APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY is required}
  AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-parloq_flow_session}
  AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-336}
  COOKIE_SECURE: "true"
  LOGIN_SECURITY_ENABLED: "true"
  LOGIN_LOCK_WINDOW_SECONDS: ${LOGIN_LOCK_WINDOW_SECONDS:-900}
  LOGIN_LOCK_SECONDS: ${LOGIN_LOCK_SECONDS:-600}
  LOGIN_USER_FAILURE_LIMIT: ${LOGIN_USER_FAILURE_LIMIT:-5}
  LOGIN_IP_FAILURE_LIMIT: ${LOGIN_IP_FAILURE_LIMIT:-20}
  TURNSTILE_ENABLED: "true"
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?TURNSTILE_SITE_KEY is required}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY is required}
  DATA_ENCRYPTION_ACTIVE_KEY_ID: ${DATA_ENCRYPTION_ACTIVE_KEY_ID:-}
  DATA_ENCRYPTION_KEYS: '${DATA_ENCRYPTION_KEYS:-}'
  MANAGEMENT_ORIGIN: ${MANAGEMENT_ORIGIN:?MANAGEMENT_ORIGIN is required}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  AUTO_CREATE_TABLES: "false"
  BITLY_MOCK: ${BITLY_MOCK:-false}
  IP_PROXY_MOCK: ${IP_PROXY_MOCK:-false}
  WA_GATEWAY_BASE_URL: http://wa-gateway:8010
  WA_GATEWAY_API_TOKEN: ${WA_GATEWAY_API_TOKEN:?WA_GATEWAY_API_TOKEN is required}
  WA_GATEWAY_MOCK: "false"
  WA_GATEWAY_WEBHOOK_SECRET: ${WA_GATEWAY_WEBHOOK_SECRET:?WA_GATEWAY_WEBHOOK_SECRET is required}
  PROTOCOL_BUILDER_URL: http://protocol-builder:8011
  PROTOCOL_BUILDER_API_TOKEN: ${WA_GATEWAY_API_TOKEN:?WA_GATEWAY_API_TOKEN is required}
  PROTOCOL_BUILD_TIMEOUT_SECONDS: ${PROTOCOL_BUILD_TIMEOUT_SECONDS:-300}
  TASK_QUEUE_MOCK: "false"
  TASK_WORKER_MAX_CONCURRENCY: ${TASK_WORKER_MAX_CONCURRENCY:-200}
  DOMAIN_VERIFY_MOCK: ${DOMAIN_VERIFY_MOCK:-false}
  DOMAIN_REGISTRAR_MOCK: ${DOMAIN_REGISTRAR_MOCK:-false}
  PROMOTION_INGRESS_HOST: ${PROMOTION_INGRESS_HOST:-center.parloq.com}
  PROMOTION_SUCCESS_WEBHOOK_SECRET: ${PROMOTION_SUCCESS_WEBHOOK_SECRET:?PROMOTION_SUCCESS_WEBHOOK_SECRET is required}
  META_CAPI_MOCK: ${META_CAPI_MOCK:-false}
  META_CAPI_BASE_URL: ${META_CAPI_BASE_URL:-https://graph.facebook.com}
  META_CAPI_API_VERSION: ${META_CAPI_API_VERSION:-v23.0}
  META_CAPI_MAX_ATTEMPTS: ${META_CAPI_MAX_ATTEMPTS:-5}
  META_CAPI_BATCH_SIZE: ${META_CAPI_BATCH_SIZE:-50}
  SYSTEM_HOST_PROC_PATH: /host/proc
  SYSTEM_HOST_DISK_PATH: /host/root

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 1gb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${PARLOQ_PERSIST_ROOT:-/data/parloq-flow}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - ${PARLOQ_PERSIST_ROOT:-/data/parloq-flow}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  migrate:
    image: ${PARLOQ_API_IMAGE:-parloq-flow-api-server:latest}
    pull_policy: never
    restart: "no"
    profiles: ["migration"]
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *api-environment
      SNOWFLAKE_NODE_ID: ${MIGRATION_SNOWFLAKE_NODE_ID:-0}
    depends_on:
      postgres:
        condition: service_healthy

  wa-gateway:
    image: ${PARLOQ_WA_GATEWAY_IMAGE:-parloq-flow-wa-gateway-server:latest}
    pull_policy: ${PARLOQ_APP_PULL_POLICY:-build}
    build: *gateway-build
    restart: unless-stopped
    environment:
      SNOWFLAKE_NODE_ID: ${WA_GATEWAY_SNOWFLAKE_NODE_ID:-3}
      NODE_ENV: production
      LOG_LEVEL: ${WA_GATEWAY_LOG_LEVEL:-info}
      WA_ENGINE: baileys
      WA_GATEWAY_ADDR: :8010
      WA_GATEWAY_INSTANCE_ID: ${WA_GATEWAY_INSTANCE_ID:-parloq-flow-prod-1}
      WA_GATEWAY_API_TOKEN: ${WA_GATEWAY_API_TOKEN:?WA_GATEWAY_API_TOKEN is required}
      WA_GATEWAY_DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      WA_GATEWAY_SEND_QPS: ${WA_GATEWAY_SEND_QPS:-10}
      WA_GATEWAY_ACCOUNT_QUEUE_SIZE: ${WA_GATEWAY_ACCOUNT_QUEUE_SIZE:-1000}
      WA_GATEWAY_DATABASE_MAX_CONNECTIONS: ${WA_GATEWAY_DATABASE_MAX_CONNECTIONS:-50}
      WA_GATEWAY_WEBHOOK_URL: http://api:8000/api/internal/wa-gateway/events
      WA_GATEWAY_WEBHOOK_SECRET: ${WA_GATEWAY_WEBHOOK_SECRET:?WA_GATEWAY_WEBHOOK_SECRET is required}
      WA_GATEWAY_WEBHOOK_RETRIES: ${WA_GATEWAY_WEBHOOK_RETRIES:-3}
      WA_GATEWAY_MATERIAL_BASE_URL: http://api:8000
      PROTOCOL_ARTIFACT_ROOT: /var/lib/parloq/protocols
      WA_PROTOCOL_RUNTIME_DATABASE_MAX_CONNECTIONS: ${WA_PROTOCOL_RUNTIME_DATABASE_MAX_CONNECTIONS:-10}
    volumes:
      - ${PARLOQ_PERSIST_ROOT:-/data/parloq-flow}/protocol-artifacts:/var/lib/parloq/protocols:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8010/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  protocol-builder:
    image: ${PARLOQ_WA_GATEWAY_IMAGE:-parloq-flow-wa-gateway-server:latest}
    pull_policy: ${PARLOQ_APP_PULL_POLICY:-build}
    build: *gateway-build
    restart: unless-stopped
    command: ["node", "dist/builder-server.js"]
    user: "0:0"
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${WA_GATEWAY_LOG_LEVEL:-info}
      PROTOCOL_BUILDER_ADDR: :8011
      PROTOCOL_BUILDER_API_TOKEN: ${WA_GATEWAY_API_TOKEN:?WA_GATEWAY_API_TOKEN is required}
      PROTOCOL_ARTIFACT_ROOT: /var/lib/parloq/protocols
      PROTOCOL_BUILD_TIMEOUT_SECONDS: ${PROTOCOL_BUILD_TIMEOUT_SECONDS:-300}
    volumes:
      - ${PARLOQ_PERSIST_ROOT:-/data/parloq-flow}/protocol-artifacts:/var/lib/parloq/protocols
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8011/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    image: ${PARLOQ_API_IMAGE:-parloq-flow-api-server:latest}
    pull_policy: ${PARLOQ_APP_PULL_POLICY:-build}
    build: *api-build
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      <<: *api-environment
      AUTO_MIGRATE: "true"
      SNOWFLAKE_NODE_ID: ${API_SNOWFLAKE_NODE_ID:-1}
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /
        target: /host/root
        read_only: true
        bind:
          propagation: rslave
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wa-gateway:
        condition: service_healthy
      protocol-builder:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  api-worker:
    image: ${PARLOQ_API_IMAGE:-parloq-flow-api-server:latest}
    pull_policy: never
    restart: unless-stopped
    command: ["python", "-m", "app.task_worker"]
    environment:
      <<: *api-environment
      SNOWFLAKE_NODE_ID: ${WORKER_SNOWFLAKE_NODE_ID:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wa-gateway:
        condition: service_healthy
      api:
        condition: service_healthy
      protocol-builder:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    image: ${PARLOQ_WEB_IMAGE:-parloq-flow-web-server:latest}
    pull_policy: ${PARLOQ_APP_PULL_POLICY:-build}
    build: *web-build
    restart: unless-stopped
    environment:
      MANAGEMENT_ORIGIN: ${MANAGEMENT_ORIGIN:?MANAGEMENT_ORIGIN is required}
    ports:
      - "127.0.0.1:${PARLOQ_HTTP_PORT:-18100}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
